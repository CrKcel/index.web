<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The module bundle paints the surface through inline custom properties,
         but it runs long after the first frame. Resolving the stored choice here
         keeps a dark-mode reader from seeing the light paper once. -->
    <script data-theme-boot>
      (() => {
        let stored = null;
        try {
          stored = JSON.parse(localStorage.getItem("rhine-settings") ?? "null");
        } catch {}
        const chosen = stored?.colorTheme;
        const choice = ["system", "light", "dark"].includes(chosen) ? chosen : "system";
        if (!(choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches))) return;
        const root = document.documentElement;
        root.dataset.darkSurface = "true";
        // The stylesheet answers with the dark palette, but until it lands (a
        // dev server injects it from JavaScript) the first frame needs the dark
        // paper of src/theme-palette.ts as a colour.
        root.style.backgroundColor = "#11181b";
      })();
    </script>
    <meta name="theme-color" content="#e8e5e1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rhine Lab" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Rhine Lab — Synthesize Information Analysis OS. 交互式三维研究档案终端。"
    />
    <title>RHINE LAB · ANALYSIS OS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="viewport"><div id="stage"></div></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
